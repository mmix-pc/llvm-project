import shlex
import os

# Private MMIX runtime injection uses the build's Linux x86-64 host compiler,
# not a target compiler or an installed cross-toolchain default configuration.
host_cxx = getattr(config, "host_cxx", "").strip()
host_triple = getattr(config, "host_triple", "")
if host_cxx and host_triple.startswith("x86_64-") and "linux" in host_triple:
    config.available_features.add("mmix-native-linux-host")
    config.substitutions.append(("%mmix_host_cxx", shlex.quote(host_cxx)))
    if "clang" in os.path.basename(host_cxx):
        config.available_features.add("mmix-native-linux-clang")
