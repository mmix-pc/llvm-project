header: iconv.h
standards: [posix]
types:
  - type_name: iconv_t
  - type_name: size_t
functions:
  - name: iconv
    standards: [posix]
    return_type: size_t
    arguments:
      - type: iconv_t
      - type: char **__restrict
      - type: size_t *__restrict
      - type: char **__restrict
      - type: size_t *__restrict
