header: sys/shm.h
standards: [posix]
public_includes: [sys/ipc.h]
macros:
  - macro_name: SHM_RDONLY
    macro_header: sys-shm-macros.h
  - macro_name: SHM_RND
    macro_header: sys-shm-macros.h
  - macro_name: SHMLBA
    macro_header: sys-shm-macros.h
  - macro_name: SHM_FAILED
    macro_header: sys-shm-macros.h
types:
  - type_name: shmatt_t
  - type_name: struct_shmid_ds
  - type_name: intptr_t
  - type_name: pid_t
  - type_name: time_t
  - type_name: size_t
functions:
  - name: shmat
    return_type: void *
    arguments:
      - type: int
      - type: const void *
      - type: int
  - name: shmctl
    return_type: int
    arguments:
      - type: int
      - type: int
      - type: struct shmid_ds *
  - name: shmdt
    return_type: int
    arguments:
      - type: const void *
  - name: shmget
    return_type: int
    arguments:
      - type: key_t
      - type: size_t
      - type: int
