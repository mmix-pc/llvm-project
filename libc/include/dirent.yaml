header: dirent.h
standards:
  - posix
macros:
  - macro_name: DT_UNKNOWN
    macro_header: dirent-macros.h
  - macro_name: DT_FIFO
    macro_header: dirent-macros.h
  - macro_name: DT_CHR
    macro_header: dirent-macros.h
  - macro_name: DT_DIR
    macro_header: dirent-macros.h
  - macro_name: DT_BLK
    macro_header: dirent-macros.h
