      - type: __dirent_compare_t
  - name: scandirat
    noexcept: false
    standards: [gnu]
    return_type: int
    arguments:
      - type: int
      - type: const char *
      - type: struct dirent ***
      - type: __dirent_filter_t
      - type: __dirent_compare_t
  - name: versionsort
    standards: [gnu]
    return_type: int
    arguments:
      - type: const struct dirent **
      - type: const struct dirent **
  - name: posix_getdents
    noexcept: false
    standards: [posix]
    return_type: ssize_t
    arguments:
      - type: int
      - type: void *
      - type: size_t
      - type: int
